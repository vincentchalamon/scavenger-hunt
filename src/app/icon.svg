<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6C8"/>
      <stop offset="100%" style="stop-color:#E8D5A3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#A07C1C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" ry="7" fill="none" stroke="#C49A28" stroke-width="1.5"/>

  <!-- Magnifying glass circle -->
  <circle cx="13.5" cy="13.5" r="7" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="13.5" cy="13.5" r="5" fill="rgba(212,175,55,0.12)"/>

  <!-- Handle -->
  <line x1="18.8" y1="18.8" x2="24" y2="24" stroke="#8B5A13" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Crosshair inside lens -->
  <line x1="13.5" y1="10" x2="13.5" y2="17" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="13.5" x2="17" y2="13.5" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <circle cx="13.5" cy="13.5" r="1.5" fill="#D4AF37"/>
</svg>
