name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci --legacy-peer-deps
      - run: npm run build --if-present
      - id: deployment
        uses: actions/deploy-pages@v4
