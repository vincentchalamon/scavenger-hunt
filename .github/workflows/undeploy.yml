name: Undeploy from GitHub Pages

on:
  # Manual trigger only
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  undeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create maintenance page using Markdown
        run: |
          mkdir -p out
          echo "# Application temporairement indisponible" > out/README.md
          echo "" >> out/README.md
          echo "Cette application a été désinstallée." >> out/README.md
          echo "Contactez l'administrateur pour plus d'informations." >> out/README.md
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
